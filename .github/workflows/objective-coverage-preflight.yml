name: Objective coverage preflight

on:
  push:
    branches: [fix/objective-coverage-and-remaining-images]

permissions:
  contents: write

concurrency:
  group: objective-coverage-preflight
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate and validate static assessments
        run: |
          python3 -m py_compile scripts/build_objective_assessments.py
          python3 scripts/build_objective_assessments.py --write
          python3 scripts/build_objective_assessments.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and check answer panels, objective anchors and image paths
        run: |
          quarto render
          python3 scripts/build_objective_assessments.py --check-html docs

      - name: Commit validated static source files to this working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add practice study-guides assessment/coverage-audit.json assessment/coverage-map.csv
          git add OBJECTIVE_COVERAGE_AUDIT.md QA_AUDIT.md PRACTICE_EXAMS_AUDIT.md
          git add SOURCE_FIGURE_PERMISSIONS_REGISTER.md SOURCE_FIGURE_LAYER_AUDIT.md VISUAL_STUDY_GUIDE_STANDARD_LOCKED.md
          git add -u assets/source-figures
          if ! git diff --cached --quiet; then
            git commit -m 'Generate and validate complete objective-linked practice and exams'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload rendered review copy
        uses: actions/upload-artifact@v4
        with:
          name: objective-coverage-review
          path: |
            docs/
            assessment/coverage-audit.json
            assessment/coverage-map.csv
            OBJECTIVE_COVERAGE_AUDIT.md
          retention-days: 7
