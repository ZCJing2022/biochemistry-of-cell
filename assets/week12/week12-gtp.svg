<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="GTPase ON/OFF cycle"><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="500" fill="#fff" rx="24"/><text x="42" y="48" class="t h">GTPase ON/OFF cycle</text><text x="42" y="76" class="t s">GTP-bound = ON • GDP-bound = OFF</text><circle cx="600" cy="255" r="78" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="600" y="250" text-anchor="middle" class="t m">Ras</text><text x="600" y="280" text-anchor="middle" class="t s">molecular switch</text><circle cx="600" cy="105" r="58" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="600" y="100" text-anchor="middle" class="t m">GDP</text><text x="600" y="127" text-anchor="middle" class="t s">OFF</text><circle cx="750" cy="255" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="750" y="250" text-anchor="middle" class="t m">GEF</text><text x="750" y="277" text-anchor="middle" class="t s">GDP out</text><circle cx="600" cy="405" r="58" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="600" y="400" text-anchor="middle" class="t m">GTP</text><text x="600" y="427" text-anchor="middle" class="t s">ON</text><circle cx="450" cy="255.00000000000003" r="58" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="450" y="250.00000000000003" text-anchor="middle" class="t m">GAP</text><text x="450" y="277" text-anchor="middle" class="t s">hydrolysis</text></svg>