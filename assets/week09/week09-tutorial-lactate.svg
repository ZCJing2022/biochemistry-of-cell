<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Course visual: why lactate keeps glycolysis running">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="420" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Course visual: why lactate keeps glycolysis running</text><text x="42" y="76" class="t s">Faithful adaptation of Tutorial 6 “No oxygen? Pyruvate becomes lactate”</text><rect class="box" x="40" y="135" width="208" height="120" fill="#e0f2fe" stroke="#0284c7"/><text x="144" y="178" text-anchor="middle" class="t m">Glycolysis step 6</text><text x="144" y="208" text-anchor="middle" class="t s">NAD⁺ → NADH</text><line class="arr" x1="252" y1="195" x2="264" y2="195"/><rect class="box" x="268" y="135" width="208" height="120" fill="#ede9fe" stroke="#7c3aed"/><text x="372" y="178" text-anchor="middle" class="t m">Low oxygen</text><text x="372" y="208" text-anchor="middle" class="t s">ETC cannot unload NADH</text><line class="arr" x1="480" y1="195" x2="492" y2="195"/><rect class="box" x="496" y="135" width="208" height="120" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="178" text-anchor="middle" class="t m">LDH</text><text x="600" y="208" text-anchor="middle" class="t s">pyruvate + NADH</text><line class="arr" x1="708" y1="195" x2="720" y2="195"/><rect class="box" x="724" y="135" width="208" height="120" fill="#fef3c7" stroke="#d97706"/><text x="828" y="178" text-anchor="middle" class="t m">Lactate + NAD⁺</text><text x="828" y="208" text-anchor="middle" class="t s">NAD⁺ regenerated</text><line class="arr" x1="936" y1="195" x2="948" y2="195"/><rect class="box" x="952" y="135" width="208" height="120" fill="#fee2e2" stroke="#dc2626"/><text x="1056" y="178" text-anchor="middle" class="t m">Glycolysis continues</text><text x="1056" y="208" text-anchor="middle" class="t s">2 ATP per glucose</text></svg>