<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Course visual: per glucose through the end of the CAC">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Course visual: per glucose through the end of the CAC</text><text x="42" y="76" class="t s">Faithful adaptation of Tutorial 6 accounting table</text><rect class="box" x="50" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="180" y="158" text-anchor="middle" class="t m">Glycolysis</text><text x="180" y="192" text-anchor="middle" class="t s">2 NADH</text><text x="180" y="220" text-anchor="middle" class="t s">2 ATP</text><rect class="box" x="330" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="460" y="158" text-anchor="middle" class="t m">PDH</text><text x="460" y="192" text-anchor="middle" class="t s">2 NADH</text><text x="460" y="220" text-anchor="middle" class="t s">2 CO₂</text><rect class="box" x="610" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="158" text-anchor="middle" class="t m">CAC ×2</text><text x="740" y="192" text-anchor="middle" class="t s">6 NADH + 2 FADH₂</text><text x="740" y="220" text-anchor="middle" class="t s">2 GTP + 4 CO₂</text><rect class="box" x="890" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="1020" y="158" text-anchor="middle" class="t m">Total</text><text x="1020" y="192" text-anchor="middle" class="t s">10 NADH + 2 FADH₂</text><text x="1020" y="220" text-anchor="middle" class="t s">4 ATP equivalents + 6 CO₂</text></svg>