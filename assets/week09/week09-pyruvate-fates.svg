<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Three broad fates of pyruvate">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="420" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Three broad fates of pyruvate</text><text x="42" y="76" class="t s">Lecture 9 comparison</text><rect class="box" x="40" y="135" width="265" height="120" fill="#e0f2fe" stroke="#0284c7"/><text x="172.5" y="178" text-anchor="middle" class="t m">Pyruvate</text><text x="172.5" y="208" text-anchor="middle" class="t s">end of glycolysis</text><line class="arr" x1="309" y1="195" x2="321" y2="195"/><rect class="box" x="325" y="135" width="265" height="120" fill="#ede9fe" stroke="#7c3aed"/><text x="457.5" y="178" text-anchor="middle" class="t m">Aerobic</text><text x="457.5" y="208" text-anchor="middle" class="t s">PDH → acetyl-CoA</text><text x="457.5" y="233" text-anchor="middle" class="t s">mitochondria</text><line class="arr" x1="594" y1="195" x2="606" y2="195"/><rect class="box" x="610" y="135" width="265" height="120" fill="#dcfce7" stroke="#16a34a"/><text x="742.5" y="178" text-anchor="middle" class="t m">Low O₂</text><text x="742.5" y="208" text-anchor="middle" class="t s">lactate</text><text x="742.5" y="233" text-anchor="middle" class="t s">regenerate NAD⁺</text><line class="arr" x1="879" y1="195" x2="891" y2="195"/><rect class="box" x="895" y="135" width="265" height="120" fill="#fef3c7" stroke="#d97706"/><text x="1027.5" y="178" text-anchor="middle" class="t m">Other organisms</text><text x="1027.5" y="208" text-anchor="middle" class="t s">fermentation</text><text x="1027.5" y="233" text-anchor="middle" class="t s">e.g. ethanol</text></svg>