<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">Two ways cells drive pathways forward</title><desc id="desc">Panel one shows coupling an unfavorable glucose phosphorylation to ATP hydrolysis. Panel two shows product removal pulling a reversible reaction forward.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.m{font-size:21px;font-weight:700}.s{font-size:18px;fill:#4b5563}.box{rx:16;ry:16;stroke-width:2}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1200" height="410" fill="#f8fafc" rx="24"/><text x="45" y="48" class="t h">Two ways cells keep a pathway moving forward</text>
<g transform="translate(45 85)"><rect class="box" x="0" y="0" width="530" height="270" fill="#ffffff" stroke="#cbd5e1"/><text x="25" y="40" class="t m">1. Couple an unfavorable reaction to ATP hydrolysis</text>
<rect class="box" x="28" y="78" width="195" height="62" fill="#fff7ed" stroke="#ea580c"/><text x="125" y="104" text-anchor="middle" class="t s">Glucose + Pi</text><text x="125" y="128" text-anchor="middle" class="t s">ΔG°′ ≈ +13.8</text><line class="arr" x1="226" y1="109" x2="304" y2="109"/><rect class="box" x="310" y="78" width="190" height="62" fill="#ecfdf5" stroke="#16a34a"/><text x="405" y="104" text-anchor="middle" class="t s">Glucose-6-P</text><text x="405" y="128" text-anchor="middle" class="t s">activated product</text>
<rect class="box" x="28" y="166" width="195" height="62" fill="#ede9fe" stroke="#7c3aed"/><text x="125" y="192" text-anchor="middle" class="t s">ATP + H₂O</text><text x="125" y="216" text-anchor="middle" class="t s">ΔG°′ ≈ −30.5</text><line class="arr" x1="226" y1="197" x2="304" y2="197"/><rect class="box" x="310" y="166" width="190" height="62" fill="#e0f2fe" stroke="#0284c7"/><text x="405" y="192" text-anchor="middle" class="t s">ADP + Pi</text><text x="405" y="216" text-anchor="middle" class="t s">energy released</text><text x="265" y="253" text-anchor="middle" class="t s">Combined process can have a negative net ΔG</text>
<rect class="box" x="575" y="0" width="535" height="270" fill="#ffffff" stroke="#cbd5e1"/><text x="600" y="40" class="t m">2. Remove product before equilibrium is reached</text><rect class="box" x="620" y="92" width="120" height="62" fill="#e0f2fe" stroke="#0284c7"/><text x="680" y="129" text-anchor="middle" class="t m">A</text><line x1="744" y1="123" x2="841" y2="123" stroke="#475569" stroke-width="3"/><path d="M825 115 L842 123 L825 131" fill="none" stroke="#475569" stroke-width="3"/><path d="M760 115 L743 123 L760 131" fill="none" stroke="#475569" stroke-width="3"/><rect class="box" x="850" y="92" width="120" height="62" fill="#fef3c7" stroke="#d97706"/><text x="910" y="129" text-anchor="middle" class="t m">B</text><line class="arr" x1="974" y1="123" x2="1040" y2="123"/><rect class="box" x="1046" y="92" width="42" height="62" fill="#dcfce7" stroke="#16a34a"/><text x="1067" y="129" text-anchor="middle" class="t m">C</text><text x="845" y="192" text-anchor="middle" class="t s">Rapid use of B lowers [B]</text><text x="845" y="219" text-anchor="middle" class="t s">and pulls A ⇌ B toward B</text><text x="845" y="246" text-anchor="middle" class="t s">Actual ΔG depends on concentrations</text></g></svg>