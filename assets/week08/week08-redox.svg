<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355" role="img" aria-labelledby="title desc">
<title id="title">Redox and NAD plus NADH</title><desc id="desc">A source molecule loses electrons to NAD plus forming NADH; NADH later donates electrons toward oxygen.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:22px;font-weight:700}.s{font-size:18px;fill:#4b5563}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1200" height="355" fill="#ffffff" rx="24"/><text x="45" y="48" class="t h">Redox: electrons move in pairs of coupled reactions</text>
<g transform="translate(60 100)"><rect class="box" x="0" y="0" width="210" height="105" fill="#fff7ed" stroke="#ea580c"/><text x="105" y="39" text-anchor="middle" class="t m">Fuel molecule</text><text x="105" y="70" text-anchor="middle" class="t s">loses electrons</text><text x="105" y="94" text-anchor="middle" class="t s">OXIDIZED</text><line class="arr" x1="220" y1="52" x2="360" y2="52"/><text x="290" y="34" text-anchor="middle" class="t s">2 e⁻ + H⁺</text>
<rect class="box" x="370" y="0" width="220" height="105" fill="#e0f2fe" stroke="#0284c7"/><text x="480" y="39" text-anchor="middle" class="t m">NAD⁺</text><text x="480" y="70" text-anchor="middle" class="t s">accepts electrons</text><text x="480" y="94" text-anchor="middle" class="t s">REDUCED</text><line class="arr" x1="600" y1="52" x2="720" y2="52"/><rect class="box" x="730" y="0" width="220" height="105" fill="#ecfdf5" stroke="#16a34a"/><text x="840" y="39" text-anchor="middle" class="t m">NADH</text><text x="840" y="70" text-anchor="middle" class="t s">carries electrons</text><text x="840" y="94" text-anchor="middle" class="t s">reduced carrier</text><line class="arr" x1="960" y1="52" x2="1045" y2="52"/><rect class="box" x="1052" y="0" width="80" height="105" fill="#f3e8ff" stroke="#9333ea"/><text x="1092" y="45" text-anchor="middle" class="t m">O₂</text><text x="1092" y="75" text-anchor="middle" class="t s">later</text><text x="0" y="160" class="t m">OIL RIG</text><text x="115" y="160" class="t s">Oxidation Is Loss • Reduction Is Gain</text><text x="0" y="195" class="t s">Every oxidation must be accompanied by a reduction; electrons are transferred, not created or destroyed.</text></g></svg>