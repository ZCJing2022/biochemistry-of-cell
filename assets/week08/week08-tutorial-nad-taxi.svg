<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">NAD plus and NADH taxi analogy</title><desc id="desc">Adapted from Tutorial 5. NAD plus is shown as an unloaded taxi and NADH as a loaded taxi carrying two electrons and a proton equivalent.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.m{font-size:19px;font-weight:700}.s{font-size:16px;fill:#475569}.car{fill:#facc15;stroke:#ca8a04;stroke-width:4}.win{fill:#bae6fd;stroke:#0284c7;stroke-width:2}.wheel{fill:#1f2937}.arr{stroke:#475569;stroke-width:5;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1100" height="430" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Tutorial visual: NAD⁺ is the “unloaded taxi”; NADH is the loaded carrier</text>
<g transform="translate(80 95)">
<g transform="translate(0 0)"><path class="car" d="M45,110 h300 l-28,-72 c-8,-20 -24,-30 -48,-30H120c-24,0 -40,10 -48,30Z"/><rect class="win" x="108" y="25" width="150" height="58" rx="12"/><rect x="35" y="110" width="320" height="55" rx="12" fill="#f59e0b" stroke="#ca8a04" stroke-width="4"/><circle class="wheel" cx="100" cy="175" r="30"/><circle class="wheel" cx="290" cy="175" r="30"/><rect x="135" y="124" width="120" height="38" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/><text x="195" y="150" text-anchor="middle" class="t m">NAD⁺</text><text x="195" y="235" text-anchor="middle" class="t m">UNLOADED</text></g>
<line class="arr" x1="395" y1="120" x2="535" y2="120"/>
<g transform="translate(580 0)"><path class="car" d="M45,110 h300 l-28,-72 c-8,-20 -24,-30 -48,-30H120c-24,0 -40,10 -48,30Z"/><rect class="win" x="108" y="25" width="150" height="58" rx="12"/><circle cx="155" cy="53" r="20" fill="#60a5fa"/><circle cx="212" cy="53" r="20" fill="#60a5fa"/><circle cx="270" cy="53" r="16" fill="#fca5a5"/><text x="155" y="59" text-anchor="middle" class="t s">e⁻</text><text x="212" y="59" text-anchor="middle" class="t s">e⁻</text><text x="270" y="59" text-anchor="middle" class="t s">H⁺</text><rect x="35" y="110" width="320" height="55" rx="12" fill="#f59e0b" stroke="#ca8a04" stroke-width="4"/><circle class="wheel" cx="100" cy="175" r="30"/><circle class="wheel" cx="290" cy="175" r="30"/><rect x="135" y="124" width="120" height="38" rx="8" fill="#fff" stroke="#334155" stroke-width="2"/><text x="195" y="150" text-anchor="middle" class="t m">NADH</text><text x="195" y="235" text-anchor="middle" class="t m">LOADED</text></g>
<text x="470" y="290" text-anchor="middle" class="t s">NAD⁺ accepts reducing equivalents → NADH carries them to later reactions</text>
</g></svg>