<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc">
<title id="title">Enzymes lower activation energy</title><desc id="desc">Two energy profiles have the same reactant and product free energies but different activation barriers.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px}.s{font-size:17px;fill:#4b5563}.axis{stroke:#334155;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}</style>
<rect width="1050" height="430" fill="#f8fafc" rx="24"/><text x="45" y="48" class="t h">Enzymes change the barrier, not the overall ΔG</text><line x1="110" y1="340" x2="930" y2="340" class="axis"/><line x1="110" y1="340" x2="110" y2="90" class="axis"/><text x="485" y="397" class="t m">Reaction progress</text><text x="24" y="225" class="t m" transform="rotate(-90 24 225)">Free energy</text>
<path d="M130,270 C250,265 285,105 410,105 C540,105 585,285 760,285 C830,285 865,285 910,285" fill="none" stroke="#dc2626" stroke-width="6"/><path d="M130,270 C250,265 300,190 410,190 C535,190 585,285 760,285 C830,285 865,285 910,285" fill="none" stroke="#0284c7" stroke-width="6"/>
<line x1="410" y1="105" x2="410" y2="270" class="dash"/><line x1="495" y1="190" x2="495" y2="270" class="dash"/><text x="405" y="90" class="t s" text-anchor="middle">uncatalyzed transition state</text><text x="500" y="178" class="t s">catalyzed pathway</text><text x="142" y="257" class="t s">reactants</text><text x="820" y="307" class="t s">products</text><line x1="160" y1="270" x2="160" y2="285" class="axis"/><line x1="160" y1="285" x2="850" y2="285" class="dash"/><text x="850" y="268" class="t s">same ΔG</text><text x="655" y="120" class="t m" fill="#dc2626">higher activation barrier</text><text x="655" y="155" class="t m" fill="#0284c7">lower activation barrier</text><text x="655" y="195" class="t s">→ more molecules reach the transition state per unit time</text><text x="655" y="222" class="t s">→ faster reaction rate</text></svg>