<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="450" viewBox="0 0 1050 450" role="img" aria-labelledby="title desc">
<title id="title">Michaelis Menten curve</title><desc id="desc">Reaction velocity rises with substrate concentration and approaches Vmax. Km is the substrate concentration at half Vmax.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px}.s{font-size:17px;fill:#4b5563}.axis{stroke:#334155;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}</style>
<rect width="1050" height="450" fill="#ffffff" rx="24"/><text x="45" y="48" class="t h">Michaelis–Menten: saturation makes Vmax and Km visible</text><line x1="110" y1="355" x2="900" y2="355" class="axis"/><line x1="110" y1="355" x2="110" y2="90" class="axis"/><text x="470" y="415" class="t m">Substrate concentration [S]</text><text x="30" y="235" class="t m" transform="rotate(-90 30 235)">Reaction velocity v</text><path d="M110,355 C170,275 245,210 330,170 C430,122 560,100 900,92" fill="none" stroke="#0284c7" stroke-width="7"/><line x1="110" y1="92" x2="900" y2="92" class="dash"/><text x="910" y="98" class="t m">Vmax</text><line x1="110" y1="224" x2="370" y2="224" class="dash"/><text x="120" y="214" class="t s">½ Vmax</text><line x1="370" y1="224" x2="370" y2="355" class="dash"/><text x="356" y="382" class="t m">Km</text><rect x="595" y="155" width="350" height="130" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="620" y="190" class="t m">Read the curve</text><text x="620" y="222" class="t s">• Vmax = maximum rate at saturation</text><text x="620" y="250" class="t s">• Km = [S] when v = ½ Vmax</text><text x="620" y="278" class="t s">• Km has concentration units</text></svg>