<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">How to read delta G</title><desc id="desc">Three panels compare negative, zero, and positive delta G.</desc>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px}.s{font-size:17px;fill:#4b5563}.p{rx:20;ry:20;stroke-width:2}</style>
<rect width="1100" height="340" fill="#ffffff" rx="22"/><text x="45" y="48" class="t h">Read the sign of ΔG before thinking about speed</text>
<g transform="translate(45 85)">
<rect class="p" x="0" y="0" width="310" height="205" fill="#ecfdf5" stroke="#16a34a"/><text x="155" y="50" text-anchor="middle" class="t h">ΔG &lt; 0</text><text x="155" y="88" text-anchor="middle" class="t m">Exergonic</text><text x="155" y="124" text-anchor="middle" class="t s">favored as written</text><text x="155" y="151" text-anchor="middle" class="t s">free energy released</text><text x="155" y="178" text-anchor="middle" class="t s">may still be slow</text>
<rect class="p" x="350" y="0" width="310" height="205" fill="#f8fafc" stroke="#64748b"/><text x="505" y="50" text-anchor="middle" class="t h">ΔG = 0</text><text x="505" y="88" text-anchor="middle" class="t m">Equilibrium</text><text x="505" y="124" text-anchor="middle" class="t s">forward = reverse rate</text><text x="505" y="151" text-anchor="middle" class="t s">no net change</text><text x="505" y="178" text-anchor="middle" class="t s">not “no reactions”</text>
<rect class="p" x="700" y="0" width="310" height="205" fill="#fff7ed" stroke="#ea580c"/><text x="855" y="50" text-anchor="middle" class="t h">ΔG &gt; 0</text><text x="855" y="88" text-anchor="middle" class="t m">Endergonic</text><text x="855" y="124" text-anchor="middle" class="t s">unfavored as written</text><text x="855" y="151" text-anchor="middle" class="t s">requires energy input</text><text x="855" y="178" text-anchor="middle" class="t s">can be driven by coupling</text>
</g><text x="45" y="322" class="t s">Course distinction: ΔG = actual cellular conditions • ΔG°′ = defined biochemical standard conditions</text></svg>