<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Three catalytic conformations of ATP synthase">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Three catalytic conformations of ATP synthase</text><text x="42" y="76" class="t s">Faithful adaptation of Tutorial 6</text><rect class="box" x="50" y="120" width="353.3333333333333" height="190" fill="#e0f2fe" stroke="#0284c7"/><text x="226.66666666666666" y="158" text-anchor="middle" class="t m">L — Loose</text><text x="226.66666666666666" y="192" text-anchor="middle" class="t s">binds ADP + Pi</text><text x="226.66666666666666" y="220" text-anchor="middle" class="t s">substrates held</text><rect class="box" x="423.3333333333333" y="120" width="353.3333333333333" height="190" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="158" text-anchor="middle" class="t m">T — Tight</text><text x="600" y="192" text-anchor="middle" class="t s">ATP formation favored</text><text x="600" y="220" text-anchor="middle" class="t s">high affinity</text><rect class="box" x="796.6666666666666" y="120" width="353.3333333333333" height="190" fill="#fff7ed" stroke="#ea580c"/><text x="973.3333333333333" y="158" text-anchor="middle" class="t m">O — Open</text><text x="973.3333333333333" y="192" text-anchor="middle" class="t s">ATP released</text><text x="973.3333333333333" y="220" text-anchor="middle" class="t s">low affinity</text></svg>