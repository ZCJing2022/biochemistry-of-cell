<rect width="1200" height="420" fill="#fff" rx="24"/><text x="42" y="48" class="t h">ATP synthase: proton flow becomes chemical work</text><text x="42" y="76" class="t s">Lecture 10 rotational-catalysis logic</text><rect class="box" x="40" y="135" width="208" height="120" fill="#e0f2fe" stroke="#0284c7"/><text x="144" y="178" text-anchor="middle" class="t m">H⁺ in IMS</text><text x="144" y="208" text-anchor="middle" class="t s">stored gradient</text><line class="arr" x1="252" y1="195" x2="264" y2="195"/><rect class="box" x="268" y="135" width="208" height="120" fill="#ede9fe" stroke="#7c3aed"/><text x="372" y="178" text-anchor="middle" class="t m">F₀</text><text x="372" y="208" text-anchor="middle" class="t s">proton pathway</text><text x="372" y="233" text-anchor="middle" class="t s">membrane rotor</text><line class="arr" x1="480" y1="195" x2="492" y2="195"/><rect class="box" x="496" y="135" width="208" height="120" fill="#dcfce7" stroke="#16a34a"/><text x="600" y="178" text-anchor="middle" class="t m">γ shaft</text><text x="600" y="208" text-anchor="middle" class="t s">rotates</text><line class="arr" x1="708" y1="195" x2="720" y2="195"/><rect class="box" x="724" y="135" width="208" height="120" fill="#fef3c7" stroke="#d97706"/><text x="828" y="178" text-anchor="middle" class="t m">β sites</text><text x="828" y="208" text-anchor="middle" class="t s">L → T → O</text><text x="828" y="233" text-anchor="middle" class="t s">conformational cycle</text><line class="arr" x1="936" y1="195" x2="948" y2="195"/><rect class="box" x="952" y="135" width="208" height="120" fill="#fee2e2" stroke="#dc2626"/><text x="1056" y="178" text-anchor="middle" class="t m">ATP</text><text x="1056" y="208" text-anchor="middle" class="t s">ADP + Pi → ATP</text><text x="1056" y="233" text-anchor="middle" class="t s">released</text></svg>