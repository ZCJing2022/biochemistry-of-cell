<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Aspirin versus other NSAIDs"><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Aspirin versus other NSAIDs</text><rect class="box" x="50" y="120" width="260" height="190" fill="#fee2e2" stroke="#dc2626"/><text x="180" y="158" text-anchor="middle" class="t m">Aspirin</text><text x="180" y="192" text-anchor="middle" class="t s">covalent acetylation</text><text x="180" y="220" text-anchor="middle" class="t s">persistent enzyme inhibition</text><rect class="box" x="330" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="460" y="158" text-anchor="middle" class="t m">Other NSAIDs</text><text x="460" y="192" text-anchor="middle" class="t s">reversible binding</text><text x="460" y="220" text-anchor="middle" class="t s">ibuprofen/naproxen etc.</text><rect class="box" x="610" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="158" text-anchor="middle" class="t m">Platelets</text><text x="740" y="192" text-anchor="middle" class="t s">no nucleus</text><text x="740" y="220" text-anchor="middle" class="t s">cannot readily replace COX</text><rect class="box" x="890" y="120" width="260" height="190" fill="#dcfce7" stroke="#16a34a"/><text x="1020" y="158" text-anchor="middle" class="t m">Low-dose effect</text><text x="1020" y="192" text-anchor="middle" class="t s">↓ TxA₂</text><text x="1020" y="220" text-anchor="middle" class="t s">↓ aggregation / clot risk</text></svg>