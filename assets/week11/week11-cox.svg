<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="COX-1 versus COX-2"><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">COX-1 versus COX-2</text><rect class="box" x="50" y="120" width="260" height="190" fill="#e0f2fe" stroke="#0284c7"/><text x="180" y="158" text-anchor="middle" class="t m">COX-1</text><text x="180" y="192" text-anchor="middle" class="t s">constitutive</text><text x="180" y="220" text-anchor="middle" class="t s">housekeeping</text><rect class="box" x="330" y="120" width="260" height="190" fill="#fee2e2" stroke="#dc2626"/><text x="460" y="158" text-anchor="middle" class="t m">COX-2</text><text x="460" y="192" text-anchor="middle" class="t s">inducible</text><text x="460" y="220" text-anchor="middle" class="t s">inflammation</text><rect class="box" x="610" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="158" text-anchor="middle" class="t m">Shared role</text><text x="740" y="192" text-anchor="middle" class="t s">arachidonic acid → PGH₂</text><text x="740" y="220" text-anchor="middle" class="t s">PGH synthase</text><rect class="box" x="890" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="1020" y="158" text-anchor="middle" class="t m">Drug implication</text><text x="1020" y="192" text-anchor="middle" class="t s">selectivity matters</text><text x="1020" y="220" text-anchor="middle" class="t s">benefit vs side effects</text></svg>