<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Three kinds of adipose tissue">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Three kinds of adipose tissue</text><rect class="box" x="50" y="120" width="353.3333333333333" height="190" fill="#fff7ed" stroke="#ea580c"/><text x="226.66666666666666" y="158" text-anchor="middle" class="t m">White</text><text x="226.66666666666666" y="192" text-anchor="middle" class="t s">TAG storage</text><text x="226.66666666666666" y="220" text-anchor="middle" class="t s">endocrine</text><rect class="box" x="423.3333333333333" y="120" width="353.3333333333333" height="190" fill="#7c2d12" stroke="#7c2d12"/><text x="600" y="158" text-anchor="middle" class="t m">Brown</text><text x="600" y="192" text-anchor="middle" class="t s">thermogenic</text><text x="600" y="220" text-anchor="middle" class="t s">UCP1-rich mitochondria</text><rect class="box" x="796.6666666666666" y="120" width="353.3333333333333" height="190" fill="#cffafe" stroke="#0891b2"/><text x="973.3333333333333" y="158" text-anchor="middle" class="t m">Beige</text><text x="973.3333333333333" y="192" text-anchor="middle" class="t s">inducible thermogenesis</text><text x="973.3333333333333" y="220" text-anchor="middle" class="t s">can switch on heat</text></svg>