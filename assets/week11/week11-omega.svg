<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Essential fatty acids and omega numbering">
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.m{font-size:20px;font-weight:700}.s{font-size:16px;fill:#475569}.box{rx:18;ry:18;stroke-width:2}.arr{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="380" fill="#fff" rx="24"/><text x="42" y="48" class="t h">Essential fatty acids and omega numbering</text><rect class="box" x="50" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="180" y="158" text-anchor="middle" class="t m">Linoleic acid</text><text x="180" y="192" text-anchor="middle" class="t s">essential</text><text x="180" y="220" text-anchor="middle" class="t s">omega-6</text><rect class="box" x="330" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="460" y="158" text-anchor="middle" class="t m">α-Linolenic acid</text><text x="460" y="192" text-anchor="middle" class="t s">essential</text><text x="460" y="220" text-anchor="middle" class="t s">omega-3</text><rect class="box" x="610" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="740" y="158" text-anchor="middle" class="t m">Count from</text><text x="740" y="192" text-anchor="middle" class="t s">methyl (ω) end</text><text x="740" y="220" text-anchor="middle" class="t s">not carboxyl end</text><rect class="box" x="890" y="120" width="260" height="190" fill="#f8fafc" stroke="#cbd5e1"/><text x="1020" y="158" text-anchor="middle" class="t m">Cis double bonds</text><text x="1020" y="192" text-anchor="middle" class="t s">introduce kinks</text><text x="1020" y="220" text-anchor="middle" class="t s">reduce tight packing</text></svg>